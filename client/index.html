<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1e36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Armony</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f6;--surface:#fff;--surface2:#e2e5ef;--ink:#1d2140;--muted:#5b6185;
  --accent:#c9750f;--accent-soft:#f6dfba;--sage:#2f7a64;--danger:#b3362a;--line:#d3d7e6;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --player-h:84px;--side-w:224px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1e36;--surface:#252946;--surface2:#30355a;--ink:#ece8dd;--muted:#a3a8c8;
  --accent:#f2a541;--accent-soft:#4a3d2a;--sage:#7fb7a4;--danger:#ef7b6c;--line:#3a3f66}}
:root[data-theme="dark"]{--bg:#1b1e36;--surface:#252946;--surface2:#30355a;--ink:#ece8dd;--muted:#a3a8c8;
  --accent:#f2a541;--accent-soft:#4a3d2a;--sage:#7fb7a4;--danger:#ef7b6c;--line:#3a3f66}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}
audio{display:none}

.app{display:grid;grid-template-columns:var(--side-w) 1fr;min-height:100vh;padding-bottom:calc(var(--player-h) + env(safe-area-inset-bottom,0px))}
aside{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - var(--player-h));padding:22px 14px;display:flex;flex-direction:column;gap:16px;border-right:1px solid var(--line);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font:800 1.6rem/1 var(--display);letter-spacing:-.03em;color:var(--ink);text-decoration:none}
.brand i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,var(--bg) 0 3px,var(--accent) 4px 9px,var(--ink) 10px);flex:none}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;position:relative}
nav a:hover{background:var(--surface2);color:var(--ink)}
nav a.on{background:var(--accent-soft);color:var(--ink)}
nav svg{width:19px;height:19px;flex:none}
nav .dot{position:absolute;right:10px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.side-controls{margin-top:auto;display:grid;gap:8px;font-size:.85rem;color:var(--muted)}
.side-controls select{width:100%}
main{padding:28px clamp(16px,4vw,48px) 48px;min-width:0}
h1{font:800 clamp(1.9rem,4vw,2.8rem)/1.05 var(--display);letter-spacing:-.025em;margin:0 0 6px}
h2{font:600 1.25rem/1.2 var(--display);margin:32px 0 12px}
h3{font:600 1.1rem/1.25 var(--display);margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 20px}
.small{font-size:.88rem}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1d2140;font-weight:600}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 11px;font-size:.88rem}
.btn svg{width:17px;height:17px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.stack{display:grid;gap:10px}
input[type=text],input[type=url],input[type=password],input[type=search],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.88rem;color:var(--muted);font-weight:500}
label.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
label.check input{margin-top:5px;accent-color:var(--accent)}
label.check small{display:block;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid2>*,.stack>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-wrap:wrap}
.seg label{padding:7px 14px;cursor:pointer;font-weight:500}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent-soft)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs a,.tabs button{padding:9px 14px;border:0;background:none;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs .on{color:var(--ink);border-bottom-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:.92rem;color:var(--ink);text-decoration:none}
.chip:hover{border-color:var(--accent)}
.chip small{color:var(--muted)}
.icon-btn{border:0;background:none;padding:7px;border-radius:50%;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center;position:relative;text-decoration:none}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.on{color:var(--accent)}
.icon-btn .mini{position:absolute;bottom:2px;right:2px;font-size:9px;font-weight:700}

.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 16px}
.albums.strip{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:150px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.albums.strip .alb{scroll-snap-align:start}
.strip-wrap{position:relative}
.strip-nav{position:absolute;top:75px;transform:translateY(-50%);z-index:2;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgb(0 0 0 / .18)}
.strip-nav:hover{border-color:var(--muted)}
.strip-nav svg{width:20px;height:20px}
.strip-nav.prev{left:-12px}.strip-nav.next{right:-12px}
.strip-nav[hidden]{display:none}
@media (hover:none),(max-width:860px){.strip-nav{display:none}}
.alb{cursor:pointer;background:none;border:0;padding:0;text-align:left;min-width:0;color:inherit}
.art{aspect-ratio:1;border-radius:12px;background:var(--surface2);overflow:hidden;position:relative}
.alb .art{margin-bottom:8px}
.art img{width:100%;height:100%;object-fit:cover}
.alb b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alb small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{display:flex;gap:24px;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap}
.hero .art{width:min(220px,45vw);flex:none;border-radius:14px}

.songs{border-top:1px solid var(--line)}
.song{display:grid;grid-template-columns:34px 42px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:7px 6px;border-bottom:1px solid var(--line);border-radius:8px;cursor:pointer}
.song:hover{background:var(--surface2)}
.song.now{background:var(--accent-soft)}
.song .n{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;font-size:.9rem}
.song .thumb{width:42px;height:42px;border-radius:6px;background:var(--surface2);overflow:hidden}
.song .thumb img{width:100%;height:100%;object-fit:cover}
.song.noart{grid-template-columns:34px minmax(0,1fr) auto auto}
.song.noart .thumb{display:none}
.song .t{min-width:0}
.song .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .t small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .d{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.song .acts{display:flex}
.badge-off{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sage);margin-right:6px;vertical-align:middle}
.list-item{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.list-item:hover{background:var(--surface2)}
.list-item .grow{flex:1;min-width:0}
.list-item .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.list-item small{color:var(--muted)}
.list-item .pic{width:52px;height:52px;border-radius:8px;overflow:hidden;background:var(--surface2);flex:none}
.list-item .pic img{width:100%;height:100%;object-fit:cover}
.letter{font:800 1.4rem var(--display);color:var(--accent);margin:22px 0 4px}
.narrow{max-width:880px}
.empty{padding:36px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.empty h3{color:var(--ink)}
.drop{padding:28px 20px;text-align:center;border:1.5px dashed var(--line);border-radius:16px;transition:border-color .2s,background .2s}
.drop small{display:block;color:var(--muted);margin-top:4px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.tag{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.ok{background:color-mix(in srgb,var(--sage) 22%,transparent);color:var(--sage)}
.tag.err{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.tag.acc{background:var(--accent-soft);color:var(--ink)}
.banner{display:flex;gap:14px;align-items:center;background:var(--accent-soft);border-radius:14px;padding:12px 16px;margin-bottom:18px;flex-wrap:wrap}
.banner .grow{flex:1;min-width:200px}

/* in riproduzione */
.now{display:grid;grid-template-columns:minmax(260px,420px) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:start}
.bigdisc{position:relative;width:100%;aspect-ratio:1}
.bigdisc canvas{position:absolute;inset:0;width:100%;height:100%}
.bigdisc .rec{position:absolute;inset:11%;border-radius:50%;background:repeating-radial-gradient(circle,#191b30 0 2px,#23264a 2px 3px);box-shadow:0 0 0 2px var(--line)}
.bigdisc .rec img,.bigdisc .rec .lbl{position:absolute;inset:27%;border-radius:50%;width:46%;height:46%;object-fit:cover;background:var(--accent)}
.bigdisc .rec::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--bg)}
.bigdisc.spin .rec{animation:spin 4s linear infinite}
.lyrics{max-height:62vh;overflow-y:auto;padding:8vh 4px 30vh;mask-image:linear-gradient(transparent,#000 12%,#000 80%,transparent);scroll-behavior:smooth}
.lyrics p{margin:0 0 14px;font:600 clamp(1.15rem,2.2vw,1.6rem)/1.35 var(--display);color:var(--muted);cursor:pointer;transition:color .2s}
.lyrics p.on{color:var(--ink)}
.lyrics.plain p{font:500 1.05rem/1.6 var(--body);color:var(--ink);cursor:default;margin:0 0 4px}
@media (prefers-reduced-motion:reduce){.lyrics{scroll-behavior:auto}}

/* player */
.player{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:center;min-height:var(--player-h)}
.np{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.disc{width:58px;height:58px;border-radius:50%;flex:none;position:relative;background:repeating-radial-gradient(circle,#191b30 0 2px,#23264a 2px 3px);box-shadow:0 0 0 2px var(--line)}
.disc img,.disc .lbl{position:absolute;inset:14px;width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--accent)}
.disc::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--bg)}
.disc.spin{animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.disc.spin,.bigdisc.spin .rec{animation:none}}
.np .t{min-width:0}
.np b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl{display:flex;flex-direction:column;gap:4px}
.ctrl .row{justify-content:center;gap:4px;flex-wrap:nowrap}
.play{width:42px;height:42px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer}
.play svg{width:20px;height:20px}
.seek{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.extra{display:flex;justify-content:flex-end;align-items:center;gap:4px;flex-wrap:wrap}
.extra input[type=range]{max-width:100px}
.pill{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 9px;white-space:nowrap;background:none;cursor:pointer}
.pill.jam{background:var(--accent);border-color:var(--accent);color:#1d2140;font-weight:600}

/* equalizzatore */
.eq{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;align-items:end;margin:14px 0}
.eq label{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.72rem;color:var(--muted)}
.eq input{writing-mode:vertical-lr;direction:rtl;height:150px;width:24px;flex:none}

/* statistiche */
.statshero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px 56px;align-items:end;padding-bottom:28px;border-bottom:1px solid var(--line)}
.statshero .lead b{display:block;font:800 clamp(3.8rem,9vw,7.2rem)/.88 var(--display);letter-spacing:-.045em;color:var(--accent)}
.statshero .lead span{display:block;margin-top:14px;color:var(--muted);font-size:1.05rem;max-width:38ch}
.statshero .lead em{font-style:normal;font-weight:600;color:var(--ink)}
.statshero .minor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 28px;margin:0}
.statshero .minor div{display:flex;flex-direction:column-reverse}
.statshero dt{color:var(--muted);font-size:.9rem}
.statshero dd{margin:0;font:800 2.1rem/1 var(--display);letter-spacing:-.02em}
.stats-empty{display:flex;align-items:center;gap:clamp(24px,5vw,56px);padding:32px 0;max-width:760px}
.stats-empty p{color:var(--muted);max-width:46ch}
.stats-empty .vinyl{flex:none;width:clamp(120px,22vw,190px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--bg) 0 3%,var(--accent) 3.5% 30%,transparent 30.5%),repeating-radial-gradient(circle,var(--surface2) 0 2px,var(--surface) 2px 5px)}
@media (max-width:640px){.statshero{grid-template-columns:1fr}.stats-empty{flex-direction:column;align-items:flex-start}}
.hours{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;align-items:end;height:120px}
.hours i{background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.hours-l{display:grid;grid-template-columns:repeat(24,1fr);font-size:.68rem;color:var(--muted);text-align:center}
.rank{counter-reset:r;list-style:none;padding:0;margin:0}
.rank li{counter-increment:r;display:flex;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.rank li::before{content:counter(r);font:800 1.1rem var(--display);color:var(--accent);width:24px;text-align:right}
.rank .grow{flex:1;min-width:0}
.rank b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank small{color:var(--muted)}
.setsearch{display:flex;align-items:center;gap:10px;max-width:880px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 16px;margin:4px 0 8px}
.setsearch:focus-within{border-color:var(--accent)}
.setsearch svg{width:18px;height:18px;color:var(--muted);flex:none}
.setsearch input[type=search]{border:0;background:none;padding:11px 0;border-radius:0}
.setsearch input:focus-visible{outline:none}
.sgroup{max-width:880px;border-bottom:1px solid var(--line)}
.sgroup>summary{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;list-style:none;border-radius:8px}
.sgroup>summary::-webkit-details-marker{display:none}
.sgroup>summary h2{margin:20px 0}
.sgroup>summary svg{width:20px;height:20px;color:var(--muted);flex:none;transition:transform .2s}
.sgroup[open]>summary svg{transform:rotate(90deg)}
/* il contenuto di <details> passa da ::details-content, che *{box-sizing:inherit} non raggiunge */
.sgroup .sbody{padding-bottom:22px;box-sizing:border-box}
.sgroup[hidden],.nohit{display:none!important}
#setNone{max-width:880px;margin-top:16px}
@media (prefers-reduced-motion:reduce){.sgroup>summary svg{transition:none}}

/* jam */
.jamgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,1fr);gap:20px;align-items:start}
.peer{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.peer .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#1d2140;flex:none}
.peer .grow{flex:1;min-width:0}
.peer small{color:var(--muted);display:block}
.safety{font-size:1.25rem;letter-spacing:.12em}
.chat{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;margin-bottom:10px}
.chat p{margin:0;padding:6px 11px;background:var(--surface2);border-radius:12px;max-width:85%;font-size:.95rem}
.chat p.me{align-self:flex-end;background:var(--accent-soft)}
.chat p b{font-weight:600;margin-right:6px}
.chat p.sys{align-self:center;background:none;color:var(--muted);font-size:.82rem}
.reacts{display:flex;gap:4px;flex-wrap:wrap}
.reacts button{font-size:1.35rem;border:0;background:var(--surface2);border-radius:12px;padding:4px 9px;cursor:pointer}
.float-r{position:fixed;bottom:calc(var(--player-h) + 20px);font-size:2.4rem;pointer-events:none;z-index:60;animation:floatup 2.6s ease-out forwards}
@keyframes floatup{to{transform:translateY(-55vh) scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.float-r{animation:fadeout 2s forwards}@keyframes fadeout{to{opacity:0}}}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;word-break:break-all;background:var(--surface2);padding:10px;border-radius:10px;max-height:140px;overflow:auto}
.qr{background:#fff;padding:12px;border-radius:12px;display:inline-block}
.vote{display:inline-flex;align-items:center;gap:3px;font-size:.85rem}

dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:20px;width:min(460px,92vw);max-height:84vh;overflow:auto}
dialog::backdrop{background:rgb(10 12 28/.55)}
dialog.wide{width:min(900px,96vw)}
dialog.sheet{padding:10px 8px}
dialog.sheet .head{display:flex;gap:12px;align-items:center;padding:6px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
dialog.sheet .head .pic{width:48px;height:48px;border-radius:8px;overflow:hidden;background:var(--surface2);flex:none}
dialog.sheet .head img{width:100%;height:100%;object-fit:cover}
dialog.sheet button.mi{display:flex;width:100%;gap:12px;align-items:center;padding:10px 12px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left}
dialog.sheet button.mi:hover{background:var(--surface2)}
dialog.sheet button.mi svg{width:19px;height:19px;color:var(--muted)}
dialog video{width:100%;border-radius:10px;background:#000}
.toast{position:fixed;left:50%;bottom:calc(var(--player-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:70;font-weight:500;max-width:90vw;text-align:center}
.mobile-only{display:none}
kbd{border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:.85em;background:var(--surface2)}

@media (max-width:860px){
  :root{--player-h:128px}
  .app{grid-template-columns:minmax(0,1fr);align-content:start}
  aside{position:sticky;height:auto;z-index:10;background:var(--bg);flex-direction:row;align-items:center;padding:10px 12px;gap:10px;border-right:0;border-bottom:1px solid var(--line);top:env(safe-area-inset-top,0px);overflow:visible}
  .brand{font-size:1.2rem;padding:0}
  nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;min-width:0}
  nav a{padding:7px 10px;white-space:nowrap;font-size:.92rem}
  nav a span.lbl{display:none}
  nav a.on span.lbl{display:inline}
  nav .dot{right:3px;top:5px}
  .side-controls{display:none}
  .player{grid-template-columns:1fr auto;grid-template-areas:"np extra" "ctrl ctrl";gap:6px 10px;padding-top:8px}
  .np{grid-area:np}.ctrl{grid-area:ctrl}.extra{grid-area:extra}
  .extra input[type=range],.extra .desk-only{display:none}
  .disc{width:46px;height:46px}.disc img,.disc .lbl{inset:11px;width:24px;height:24px}
  .song,.song.noart{grid-template-columns:42px minmax(0,1fr) auto}
  .song.noart{grid-template-columns:minmax(0,1fr) auto}
  .song .n,.song .d{display:none}
  .mobile-only{display:inline-grid}
  .desk-only{display:none}
  .now,.jamgrid{grid-template-columns:1fr}
  .bigdisc{max-width:320px;margin:0 auto}
  dialog.sheet{margin:auto auto 0;width:100%;max-width:100%;border-radius:18px 18px 0 0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <a class="brand" href="#/home"><i></i>armony</a>
    <nav id="nav"></nav>
    <div class="side-controls">
      <label>Server <select id="srvSel"></select></label>
      <label>Qualità <select id="qSel"></select></label>
    </div>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>

<div class="player" id="player">
  <button class="np" id="npBtn" aria-label="Apri la schermata In riproduzione">
    <div class="disc" id="disc"><div class="lbl"></div></div>
    <div class="t"><b id="npT">Niente in riproduzione</b><small id="npA">Scegli un album o una playlist</small></div>
  </button>
  <div class="ctrl">
    <div class="row">
      <button class="icon-btn" id="bShuf" aria-label="Ordine casuale"></button>
      <button class="icon-btn" id="bPrev" aria-label="Precedente"></button>
      <button class="play" id="bPlay" aria-label="Riproduci"></button>
      <button class="icon-btn" id="bNext" aria-label="Successivo"></button>
      <button class="icon-btn" id="bRep" aria-label="Ripeti"></button>
    </div>
    <div class="seek"><span id="tCur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posizione"><span id="tDur">0:00</span></div>
  </div>
  <div class="extra">
    <button class="pill" id="jamPill" hidden></button>
    <button class="pill" id="sleepPill" hidden></button>
    <button class="pill desk-only" id="qBadge" title="Qualità di ascolto"></button>
    <button class="icon-btn mobile-only" id="bQm" aria-label="Qualità"></button>
    <button class="icon-btn" id="bLyr" aria-label="Testi"></button>
    <button class="icon-btn" id="bQueue" aria-label="Coda"></button>
    <input type="range" id="vol" min="0" max="100" value="100" aria-label="Volume">
  </div>
</div>

<dialog id="dlg"></dialog>
<dialog id="dlg2"></dialog>
<input type="file" id="filePick" hidden>

<script src="armony.js"></script>
<script src="jam.js"></script>
<script>boot();</script>
</body>
</html>
