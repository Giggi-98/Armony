<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#15172c" id="themeColor">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Armony</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  /* colori: la stanza (bg), due livelli di pannello, l'inchiostro, e l'ambra dell'etichetta del disco.
     --accent riempie (pulsanti, barre); --accent-text è l'ambra come testo, più scura nel tema chiaro per l'AA */
  --bg:#eef0f6;--surface:#fff;--surface2:#e4e7f1;--ink:#191c38;--muted:#565c80;
  --accent:#e3962a;--accent-text:#9c5806;--accent-soft:#f8e3c2;--on-accent:#191c38;--sage:#2f7a64;--danger:#b3362a;--line:#d8dcea;
  --shadow-art:0 10px 22px -14px rgb(25 28 56 / .45);--shadow-float:0 18px 40px -18px rgb(25 28 56 / .35);
  /* spazi a passi di 4 px; raggi per gerarchia, non uno solo per tutto */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --r-s:8px;--r-m:12px;--r-l:16px;--r-xl:22px;
  --hit:40px;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  /* spazi delle barre di sistema: env() nei browser e nelle WebView recenti, --safe-area-inset-* iniettate
     da Capacitor nelle WebView Android più vecchie (app/android) */
  --sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));
  --sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));
  --player-h:84px;--side-w:224px;
  /* movimento: risponde a un gesto, non decora (docs/EVOLUZIONE.md §3b) */
  --ease:cubic-bezier(.2,.8,.2,1);--ease-out:cubic-bezier(.23,1,.32,1);--t-tap:120ms;--t-move:240ms;--t-scene:420ms;
  box-sizing:border-box;padding-top:var(--sat);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15172c;--surface:#1e2140;--surface2:#2a2e55;--ink:#f1ece1;--muted:#a0a5c8;
  --accent:#f4a63c;--accent-text:#f4a63c;--accent-soft:#433729;--on-accent:#191c38;--sage:#86c2ab;--danger:#ef7b6c;--line:#2f335e;
  --shadow-art:0 14px 28px -14px rgb(0 0 0 / .7);--shadow-float:0 20px 44px -16px rgb(0 0 0 / .65)}}
:root[data-theme="dark"]{--bg:#15172c;--surface:#1e2140;--surface2:#2a2e55;--ink:#f1ece1;--muted:#a0a5c8;
  --accent:#f4a63c;--accent-text:#f4a63c;--accent-soft:#433729;--on-accent:#191c38;--sage:#86c2ab;--danger:#ef7b6c;--line:#2f335e;
  --shadow-art:0 14px 28px -14px rgb(0 0 0 / .7);--shadow-float:0 20px 44px -16px rgb(0 0 0 / .65)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:var(--sat);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior-y:none;scrollbar-color:var(--surface2) transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;font-optical-sizing:auto}
button,input,select,textarea{font:inherit;color:inherit}
/* sotto i 16 px iOS ingrandisce la pagina quando si scrive in un campo */
input,select,textarea{font-size:max(16px,1rem)}
/* i comandi rispondono subito al tocco e non si selezionano tenendo premuto; il contenuto resta selezionabile */
button,a,[role=button],summary,label.check,.seg label{touch-action:manipulation}
button,.btn,.chip,.pill,.tabs,.tabbar,nav,.seg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
::selection{background:color-mix(in srgb,var(--accent) 38%,transparent);color:var(--ink)}
input,textarea{caret-color:var(--accent)}
/* --accent riempie (pulsanti, barre); --accent-text è l'ambra come testo: nel tema chiaro più scura per restare AA */
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-s)}
img{max-width:100%;display:block}
/* hidden vince su ogni display dei componenti (.stack, .btn, .seg…): senza, un campo "nascosto" resta a schermo */
[hidden]{display:none!important}
audio{display:none}

.app{display:grid;grid-template-columns:var(--side-w) 1fr;min-height:100vh;min-height:100dvh;padding-bottom:calc(var(--player-h) + var(--sab))}
aside{z-index:1;position:sticky;top:var(--sat);height:calc(100vh - var(--player-h));height:calc(100dvh - var(--player-h) - var(--sab));padding:22px 14px;display:flex;flex-direction:column;gap:16px;border-right:1px solid var(--line);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font:800 1.6rem/1 var(--display);letter-spacing:-.03em;color:var(--ink);text-decoration:none}
.brand i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,var(--bg) 0 3px,var(--accent) 4px 9px,var(--ink) 10px);flex:none}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--r-m);color:var(--muted);text-decoration:none;font-weight:500;position:relative;transition:background var(--t-tap) ease,color var(--t-tap) ease}
nav a.on{background:var(--surface2);color:var(--ink);font-weight:600}
nav a.on svg{color:var(--accent-text)}
nav svg{width:19px;height:19px;flex:none}
nav .dot{position:absolute;right:10px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.ctx{margin-top:auto;display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border:0;border-radius:var(--r-m);background:var(--surface2);cursor:pointer;text-align:left;font-weight:600;color:var(--ink)}
.ctx .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx .pill{cursor:inherit}
/* barra delle sezioni in basso: esiste solo su telefono (vedi media query) */
.tabbar{display:none}
main{padding:var(--s6) clamp(16px,4vw,48px) var(--s7);min-width:0;position:relative;z-index:1}
/* la luce del disco (Glow in armony.js): luce sopra il fondo, mai una tinta piena */
@property --g1{syntax:'<color>';inherits:false;initial-value:transparent}
@property --g2{syntax:'<color>';inherits:false;initial-value:transparent}
@property --tint{syntax:'<color>';inherits:false;initial-value:transparent}
#glow{position:fixed;top:0;bottom:0;left:var(--side-w);right:0;z-index:0;pointer-events:none;opacity:0;--gx:24%;--gy:30%;
  background:radial-gradient(52% 58% at var(--gx) var(--gy),var(--g1),transparent 72%),radial-gradient(40% 46% at calc(var(--gx) + 34%) calc(var(--gy) - 16%),var(--g2),transparent 70%);
  transition:opacity .6s ease,--g1 1.2s ease,--g2 1.2s ease}
:root[data-glow] #glow{opacity:1}
:root[data-glow="album"] #glow{--gx:14%;--gy:8%}
h1{font:800 clamp(2.1rem,4.6vw,3.1rem)/1 var(--display);font-stretch:88%;letter-spacing:-.03em;margin:0 0 var(--s2);text-wrap:balance}
h2{font:700 1.3rem/1.2 var(--display);letter-spacing:-.012em;margin:var(--s7) 0 var(--s3);text-wrap:balance}
h3{font:700 1.08rem/1.25 var(--display);margin:0 0 var(--s2)}
.sub{color:var(--muted);margin:0 0 var(--s5);max-width:62ch}
.small{font-size:.88rem}
.small>svg{width:14px;height:14px;vertical-align:-2px;margin-right:3px}

/* tonale (predefinito), primario in ambra, pericolo; icona tonda a parte */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--hit);border:0;background:var(--surface2);padding:0 18px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.95rem;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 16px -10px color-mix(in srgb,var(--accent) 80%,transparent)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:32px;padding:0 13px;font-size:.86rem;gap:6px}
.btn svg{width:18px;height:18px;flex:none}
.btn.sm svg{width:16px;height:16px}
.btn,.icon-btn,.play,.chip,.ctx,.alb,.strip-nav{transition:transform var(--t-tap) var(--ease-out),background var(--t-tap) ease,color var(--t-tap) ease}
.btn:active,.icon-btn:active,.play:active,.chip:active,.ctx:active,.strip-nav:active{transform:scale(.96)}
.alb:active{transform:scale(.98)}
@media (pointer:coarse){:root{--hit:44px}}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.stack{display:grid;gap:var(--s3)}
input[type=text],input[type=url],input[type=password],input[type=search],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-m);padding:0 14px;min-height:var(--hit);width:100%;min-width:0;transition:border-color var(--t-tap) ease,box-shadow var(--t-tap) ease}
textarea,select[multiple]{padding:10px 14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea{resize:vertical;min-height:84px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.86rem;color:var(--muted);font-weight:600}
label.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
label.check input{margin-top:5px;accent-color:var(--accent)}
label.check small{display:block;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--s3) var(--s4)}
.grid2>*,.stack>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:var(--s5);margin-bottom:var(--s4)}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg label{padding:0 14px;min-height:calc(var(--hit) - 6px);display:inline-flex;align-items:center;border-radius:999px;cursor:pointer;font-weight:600;font-size:.92rem;color:var(--muted);transition:background var(--t-tap) ease,color var(--t-tap) ease}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .18)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}
.seg label>span{display:inline-flex;align-items:center;gap:6px}
.seg svg{width:16px;height:16px;flex:none}
.stack>.seg{justify-self:start;max-width:100%}
/* collegamento della Jam: tre voci della stessa larghezza, su una riga anche a 360 px */
.seg.jnet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));justify-self:stretch}
.seg.jnet label{justify-content:center;padding:0 6px;white-space:nowrap}
.tabs{display:flex;gap:var(--s1);border-bottom:1px solid var(--line);margin-bottom:var(--s5);overflow-x:auto;scrollbar-width:none}
.tabs a,.tabs button{padding:10px 14px;border:0;background:none;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap;transition:color var(--t-tap) ease}
.tabs .on{color:var(--ink);border-bottom-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;border:0;background:var(--surface2);border-radius:999px;padding:0 14px;cursor:pointer;font-size:.92rem;font-weight:500;color:var(--ink);text-decoration:none}
.chip small{color:var(--muted)}
.icon-btn{border:0;background:none;width:var(--hit);height:var(--hit);padding:0;border-radius:50%;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center;position:relative;text-decoration:none;flex:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn.on{color:var(--accent-text)}
.icon-btn .mini{position:absolute;bottom:2px;right:2px;font-size:9px;font-weight:700}

.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:var(--s5) var(--s4)}
.albums.strip{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:150px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.albums.strip .alb{scroll-snap-align:start}
.strip-wrap{position:relative}
.strip-nav{position:absolute;top:75px;transform:translateY(-50%);z-index:2;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgb(0 0 0 / .18)}
.strip-nav svg{width:20px;height:20px}
.strip-nav.prev{left:-12px}.strip-nav.next{right:-12px}
.strip-nav[hidden]{display:none}
@media (hover:none),(max-width:860px){.strip-nav{display:none}}
.alb{cursor:pointer;background:none;border:0;padding:0;text-align:left;min-width:0;color:inherit}
.art{aspect-ratio:1;border-radius:var(--r-m);background:var(--surface2);overflow:hidden;position:relative}
.alb .art{margin-bottom:10px;box-shadow:var(--shadow-art)}
.art img{width:100%;height:100%;object-fit:cover}
.alb b{display:block;font-weight:600;font-size:.95rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alb small{display:block;color:var(--muted);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{display:flex;gap:24px;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap}
.hero .art{width:min(232px,46vw);flex:none;border-radius:var(--r-l);box-shadow:var(--shadow-float)}

.songs{border-top:1px solid var(--line)}
.song{display:grid;grid-template-columns:34px 44px minmax(0,1fr) auto auto;gap:var(--s3);align-items:center;min-height:60px;padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer;transition:background var(--t-tap) ease}
.song.now .t b{color:var(--accent-text);font-weight:600}
/* al posto del numero, tre barre: ballano solo mentre suona */
.song.now .n{font-size:0;display:flex;justify-content:flex-end}
.song.now .n::before{content:"";width:15px;height:13px;background:linear-gradient(var(--accent-text) 0 0) 0 100%/3px 55% no-repeat,linear-gradient(var(--accent-text) 0 0) 6px 100%/3px 100% no-repeat,linear-gradient(var(--accent-text) 0 0) 12px 100%/3px 35% no-repeat}
:root[data-playing="true"] .song.now .n::before{animation:eqbars .95s ease-in-out infinite alternate}
@keyframes eqbars{50%{background-size:3px 100%,3px 40%,3px 85%}to{background-size:3px 30%,3px 75%,3px 55%}}
.song .n{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;font-size:.9rem}
.song .thumb{width:44px;height:44px;border-radius:var(--r-s);background:var(--surface2);overflow:hidden}
.song .thumb img{width:100%;height:100%;object-fit:cover}
.song.noart{grid-template-columns:34px minmax(0,1fr) auto auto}
.song.noart .thumb{display:none}
.song .t{min-width:0}
.song .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .t small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .d{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.song .acts{display:flex}
/* tracce dell'album che mancano in libreria: presenti ma spente, con il loro tasto per scaricarle */
.song.ghost{cursor:default}
.song.ghost .n,.song.ghost .t,.song.ghost .d{opacity:.5}
.song.ghost .acts{display:flex;align-items:center}
.gaps-note{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s2) var(--s3);margin:0 0 var(--s3);color:var(--muted);font-size:.92rem}
.badge-off{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sage);margin-right:6px;vertical-align:middle}
.list-item{display:flex;align-items:center;gap:var(--s3);min-height:64px;padding:8px;border-bottom:1px solid var(--line);cursor:pointer;transition:background var(--t-tap) ease}
.list-item .grow{flex:1;min-width:0}
.list-item .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.list-item small{color:var(--muted)}
.list-item .pic{width:48px;height:48px;border-radius:var(--r-s);overflow:hidden;background:var(--surface2);flex:none}
.list-item .pic img{width:100%;height:100%;object-fit:cover}
.letter{font:800 1.5rem/1 var(--display);color:var(--accent-text);margin:var(--s6) 0 var(--s2);padding-left:8px}
.narrow{max-width:880px}
.empty{padding:var(--s7) var(--s5);text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--r-l)}
.empty h3{color:var(--ink)}
.drop{padding:28px 20px;text-align:center;border:1.5px dashed var(--line);border-radius:16px;transition:border-color var(--t-move),background var(--t-move)}
.drop small{display:block;color:var(--muted);margin-top:4px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:var(--s2)}
/* foglio di aggiornamento dell'app: stesso rientro del titolo del foglio */
#aupd{padding:6px 10px 6px}
.notes{margin:0;padding-left:20px}.notes li{margin:3px 0}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.tag{display:inline-block;font-size:.76rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.ok{background:color-mix(in srgb,var(--sage) 22%,transparent);color:var(--sage)}
.tag.err{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.tag.acc{background:var(--accent-soft);color:var(--ink)}
.banner{display:flex;gap:var(--s3) var(--s4);align-items:center;background:var(--accent-soft);border-radius:var(--r-l);padding:var(--s4) var(--s5);margin-bottom:var(--s4);flex-wrap:wrap}
.banner .grow{flex:1;min-width:200px}

/* in riproduzione */
.now:not(.song){display:grid;grid-template-columns:minmax(260px,420px) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:start}
.bigdisc{position:relative;width:100%;aspect-ratio:1}
.bigdisc canvas{position:absolute;inset:0;width:100%;height:100%}
.bigdisc .rec{position:absolute;inset:11%;border-radius:50%;background:repeating-radial-gradient(circle,#191b30 0 2px,#23264a 2px 3px);box-shadow:0 0 0 2px var(--line)}
.bigdisc .rec img,.bigdisc .rec .lbl{position:absolute;inset:27%;border-radius:50%;width:46%;height:46%;object-fit:cover;background:var(--accent)}
.bigdisc .rec::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--bg)}
.lyrics{max-height:62vh;overflow-y:auto;padding:8vh 4px 30vh;mask-image:linear-gradient(transparent,#000 12%,#000 80%,transparent);scroll-behavior:smooth}
.lyrics p{margin:0 0 14px;font:600 clamp(1.15rem,2.2vw,1.6rem)/1.35 var(--display);color:var(--muted);cursor:pointer;transition:color var(--t-move)}
.lyrics p.on{color:var(--ink)}
.lyrics.plain p{font:500 1.05rem/1.6 var(--body);color:var(--ink);cursor:default;margin:0 0 4px}
@media (prefers-reduced-motion:reduce){.lyrics{scroll-behavior:auto}}

/* player */
.player{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -12px 32px -24px rgb(0 0 0 / .6);padding:10px 20px calc(10px + var(--sab));display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:center;min-height:var(--player-h)}
.np{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.disc{width:58px;height:58px;border-radius:50%;flex:none;position:relative;background:repeating-radial-gradient(circle,#191b30 0 2px,#23264a 2px 3px);box-shadow:0 0 0 2px var(--line)}
.disc img,.disc .lbl{position:absolute;inset:14px;width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--accent)}
.disc::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--bg)}
/* play/pausa: le due metà del triangolo diventano le due barre (gli attributi d in armony.js valgono dove la proprietà CSS d non c'è) */
@supports (d:path("M0 0")){
  .play svg.pp path{transition:d var(--t-move) var(--ease)}
