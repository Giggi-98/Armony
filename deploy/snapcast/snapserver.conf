# Snapcast per Armony: una sola sorgente, l'audio che Armony manda (PCM 48 kHz, 16 bit, stereo) solo da questa macchina
[server]
datadir = /var/lib/snapserver

[stream]
port = 1704
source = tcp://127.0.0.1:4953?name=Armony&mode=server&sampleformat=48000:16:2
buffer = 1000

[http]
enabled = true
bind_to_address = 0.0.0.0
port = 1780

[tcp]
enabled = true
port = 1705
