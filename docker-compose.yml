# Armony
#   Prima volta:  cp .env.example .env  e cambia le password in .env (non va su git)
#   Avvio:        docker compose up -d
#   Con TURN:     docker compose --profile turn up -d   (per Jam via 5G dietro NAT difficili)
#   Con HTTPS:    docker compose --profile https up -d  (nome tuo, es. DynDNS, con certificato vero: vedi deploy/Caddyfile)
#
#   App:          http://IP-DEL-SERVER:8080
#   Navidrome:    solo da questa macchina (127.0.0.1:4533): da fuori si passa da Armony, che controlla chiavi, revoche e
#                 permessi. Per la sua pagina d'amministrazione: ssh -L 4533:127.0.0.1:4533 utente@server, poi
#                 http://localhost:4533 sul tuo computer
#
# "network_mode: host" serve al multicast LAN e funziona su Linux (Raspberry, NAS, VPS).
# Su Docker Desktop per Mac/Windows: togli network_mode, aggiungi  ports: ["8080:8080"],
# metti NAVIDROME_URL: "http://navidrome:4533", ARMONY_POT_URL: "http://pot:4416" e ARMONY_MULTICAST: "0".

# log dei container: al più 3 file da 10 MB ciascuno (senza limite crescono per mesi e riempiono il disco di sistema)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  navidrome:
    # versione fissa: Armony legge il suo database (media_file, playlist_tracks, scrobbles), e un "latest" nuovo può
    # cambiarne lo schema. Si alza insieme a un rilascio di Armony
    image: deluan/navidrome:0.64.2
    container_name: armony-navidrome
    logging: *logging
    ports:
      - "127.0.0.1:4533:4533"
    environment:
      ND_SCANSCHEDULE: "10m"
      ND_ENABLESHARING: "true"
      ND_ENABLETRANSCODINGCONFIG: "true"
      ND_DEFAULTLANGUAGE: "it"
      ND_SESSIONTIMEOUT: "720h"
      # brani già convertiti (MP3/Opus) e copertine restano pronti: un brano riascoltato riparte subito (predefiniti: 100 MB)
      ND_TRANSCODINGCACHESIZE: "2GB"
      ND_IMAGECACHESIZE: "500MB"
    volumes:
      - ./data/navidrome:/data
      - ./musica:/music:ro
      # brani copiati dai server collegati: libreria Navidrome a parte ("Dalla rete"), che Armony crea da sola
      - ./federati:/federati:ro
    restart: unless-stopped

  armony:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: armony-app
    logging: *logging
    network_mode: host
    environment:
      ARMONY_TOKEN: "${ARMONY_TOKEN:?manca ARMONY_TOKEN in .env}"
      ARMONY_NAME: "${ARMONY_NAME:-Casa}"
      ARMONY_REPO: "${ARMONY_REPO:-Giggi-98/Armony}"
      ARMONY_PUBLIC_URL: "${ARMONY_PUBLIC_URL:-}"
      ARMONY_AVVISI: "${ARMONY_AVVISI:-}"
      # per il controllo giornaliero di nome e certificato (diagnosi.controlla_dominio), se c'è il profilo "https"
      ARMONY_DOMAIN: "${ARMONY_DOMAIN:-}"
      ARMONY_HTTPS_PORT: "${ARMONY_HTTPS_PORT:-8460}"
      NAVIDROME_ADMIN_USER: "${NAVIDROME_ADMIN_USER:-}"
      NAVIDROME_ADMIN_PASS: "${NAVIDROME_ADMIN_PASS:-}"
      ARMONY_PORT: "8080"
      ARMONY_POT_URL: "http://127.0.0.1:4416"
      ARMONY_MULTICAST: "1"
      NAVIDROME_URL: "http://127.0.0.1:4533"
      MUSIC_DIR: "/music"
      VIDEO_DIR: "/videos"
    volumes:
      - ./musica:/music
      - ./video:/videos
      - ./federati:/federati
      - ./client:/app/client:ro
      - ./updates:/updates
      - ./data/armony:/data
      # solo lettura: il percorso vero dei brani da eliminare (/api/tracks/delete)
      - ./data/navidrome:/navidrome:ro
    depends_on:
      - navidrome
      - pot
    restart: unless-stopped

  # PO Token per i download da YouTube (bgutil-ytdlp-pot-provider): senza, YouTube tratta il server da robot molto
  # prima. Nessun segreto, nessun dato; raggiungibile solo da questa macchina. "daily": a ogni "up" (tasto Aggiorna)
  # scarica l'immagine nuova se l'ultima ha più di un giorno, come yt-dlp che si aggiorna a ogni avvio
  pot:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: armony-pot
    logging: *logging
    # resta "latest": il PO Token deve seguire i cambi di YouTube insieme a yt-dlp, che si aggiorna a ogni avvio
    pull_policy: daily
    init: true
    ports:
      - "127.0.0.1:4416:4416"
    restart: unless-stopped

  # HTTPS con un nome tuo (ARMONY_DOMAIN in .env): certificato Let's Encrypt preso e rinnovato da solo. Il router
  # inoltra la 443 da internet alla porta ARMONY_HTTPS_PORT di questa macchina (8460 di base). Dettagli in deploy/Caddyfile
  https:
    image: caddy:2.8.4
    container_name: armony-https
    logging: *logging
    profiles: ["https"]
    network_mode: host
    environment:
      ARMONY_DOMAIN: "${ARMONY_DOMAIN:?manca ARMONY_DOMAIN in .env}"
      ARMONY_HTTPS_PORT: "${ARMONY_HTTPS_PORT:-8460}"
      ARMONY_PORT: "8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    restart: unless-stopped

  turn:
    image: coturn/coturn:latest
    container_name: armony-turn
    logging: *logging
    profiles: ["turn"]
    network_mode: host
    command: >
      -n --listening-port=3478 --fingerprint --lt-cred-mech
      --user=armony:${TURN_PASS:-cambiami-anche-questa} --realm=armony
      --min-port=49160 --max-port=49200 --no-cli --no-tlsv1 --no-tlsv1_1
      --no-multicast-peers --denied-peer-ip=10.0.0.0-10.255.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255 --denied-peer-ip=100.64.0.0-100.127.255.255 --denied-peer-ip=127.0.0.0-127.255.255.255
    restart: unless-stopped
